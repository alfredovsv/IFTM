<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felinos</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/felino.js" defer></script>
</head>
<body>
    <div class="container-felinos">
         <!-- Gato 1: Roxo -->
        <div class="coluna-gato">
            <img src="img/gato01.gif" alt="Gato Roxo" id="gato01">
            <p>Clique em mim!</p>
        </div>

        <!-- Gato 2: Amarelo -->
        <div class="coluna-gato">
            <img src="img/gato02.gif" alt="Gato Amarelo" id="gato02">
            <p>Clique sobre mim várias vezes!</p>
            <p>Carinhos: <span id="contador">0</span></p>
        </div>

        <!-- Gato 3: Azul -->
        <div class="coluna-gato">
            <img src="img/gato03.gif" alt="Gato Azul" id="gato03">
            <p>Passe o cursor do mouse sobre mim!</p>
        </div>

        <!-- Gato 4: Verde -->
        <div class="coluna-gato">
            <img src="img/gato04.gif" alt="Gato Verde" id="gato04">
            <p id="cocegas">lá lá lá lá lá</p>
        </div>

        <!-- Gato 5: Vermelho -->
        <div class="coluna-gato">
            <img src="img/gato05.gif" alt="Gato Vermelho">
            <input type="button" value="Gerar número da sorte" id="btnSortear">
            <input type="text" id="numeroSorteado" readonly>
        </div>
    </div>
</body>
</html>
