<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <script type="module" src="js/main.js" defer></script>
</head>

<body>
    <form action="">
        <table>
            <tr>
                <td>
                    <label for="">Valor 1: </label>
                    <input type="text" name="txtValor1" id="txtValor1">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Valor 2: </label>
                    <input type="text" name="txtValor1" id="txtValor2">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="+" id="btnSomar">
                    <input type="button" value="-" id="btnSubtrair">
                    <input type="button" value="*" id="btnMultiplicar">
                    <input type="button" value="/" id="btnDividir">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Valor 2: </label>
                    <input type="text" name="txtResultado" id="txtResultado">
                </td>
            </tr>
        </table>
    </form>

</body>

</html>
