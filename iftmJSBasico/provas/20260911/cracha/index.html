<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Crachá</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    
</head>
<body>
    <header>
        <h2>Cadastro Crachá</h2>
    </header>

    <section>
        <form action="">
            <!--Optei em fazer o form sem tabela-->
           <label for="">Primeiro Nome:</label>
           <br>
           <input type="text" name="txtNome" id="txtNome">
           <br>
           <label for="">Restante Nome:</label>
           <br>
           <input type="text" name="txtRestoNome" id="txtRestoNome">
           <br>
           <label for="">Cargo (Professor ou Desenvolvedor):</label>
           <br>
           <input type="text" name="txtCargo" id="txtCargo">
           <br>
           <label for="">Escolha a Minicurso:</label> <!-- Colo "a" para ficar igual -->
           <br>
           <input type="button" value="HTML5" id="btnHTML">
           <input type="button" value="CSS3" id="btnCSS">
           <input type="button" value="JavaScript" id="btnJS">

    </section>

    <Section>
        <h2>Crachá Gerado</h2>

        <table>
            <tr>
                <td id="crachaNome">

                </td>
            </tr>
            <tr>
                <td id="crachaInicias">

                </td>
            </tr>
            <tr>
                <td id="crachaCurso">
                    
                </td>
            </tr>
             <tr>
                <td id="crachaCargo">

                </td>
            </tr>
             <tr>
                <td id="crachaSala">

                </td>
            </tr>
        </table>

    </Section>
    
</body>
</html>
